[versions]
kotlin = "2.1.20"
intellijPlatform = "2.18.1"
intellijIdea = "2025.3.6"
junit = "5.11.4"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.4" }
# The IntelliJ test runtime the platform plugin installs still loads JUnit 4 classes, so it has to
# be on the test runtime classpath even though every test here is written against JUnit 5.
junit4 = { module = "junit:junit", version = "4.13.2" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellijPlatform" }
intellij-platform-module = { id = "org.jetbrains.intellij.platform.module", version.ref = "intellijPlatform" }
