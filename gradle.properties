# The IntelliJ Platform already ships the Kotlin stdlib - do not bundle another copy.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

# The build requires JDK 21. If your default JAVA_HOME is older, point Gradle at a JDK 21, e.g.:
# org.gradle.java.home=C:\Users\<you>\.jdks\ms-21.0.10
openDevToolsVersion=0.2.0
